<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сброс пароля</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card mt-5">
        <div class="card-body">
          <h3 class="text-center mb-4">Сброс пароля</h3>
          <div id="error" class="alert alert-danger d-none">
            <!-- Сообщение об ошибке -->
          </div>
          <div id="success" class="alert alert-success d-none">
            <!-- Сообщение об успехе -->
          </div>
          <form id="resetPasswordForm">
            <div class="mb-3">
              <label for="password" class="form-label">Новый пароль</label>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
              <input type="password" class="form-control" id="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Сбросить пароль</button>
          </form>
          <p class="text-center mt-3">
            <a href="/login.html">Вернуться к входу</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/request.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  
  if (!token) {
    document.getElementById('error').textContent = 'Отсутствует токен сброса пароля';
    document.getElementById('error').classList.remove('d-none');
    document.getElementById('resetPasswordForm').style.display = 'none';
  }
  
  document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    
    errorDiv.classList.add('d-none');
    successDiv.classList.add('d-none');
    
    if (password !== confirmPassword) {
      errorDiv.textContent = 'Пароли не совпадают';
      errorDiv.classList.remove('d-none');
      return;
    }
    
    try {
      const response = await fetch(`${API_BASE}/reset-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ token, password })
      });
      
      const data = await response.json();
      
      if (data.status === 'success') {
        successDiv.textContent = data.message;
        successDiv.classList.remove('d-none');
        document.getElementById('resetPasswordForm').style.display = 'none';
      } else {
        errorDiv.textContent = data.message;
        errorDiv.classList.remove('d-none');
      }
    } catch (error) {
      errorDiv.textContent = 'Произошла ошибка при сбросе пароля';
      errorDiv.classList.remove('d-none');
    }
  });
</script>
</body>
</html>

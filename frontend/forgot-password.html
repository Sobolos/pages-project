<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Восстановление пароля</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card mt-5">
        <div class="card-body">
          <h3 class="text-center mb-4">Восстановление пароля</h3>
          <div id="error" class="alert alert-danger d-none">
            <!-- Сообщение об ошибке -->
          </div>
          <div id="success" class="alert alert-success d-none">
            <!-- Сообщение об успехе -->
          </div>
          <form id="forgotPasswordForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Отправить ссылку</button>
          </form>
          <p class="text-center mt-3">
            <a href="/login.html">Вернуться к входу</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/request.js"></script>
<script>
  document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    
    errorDiv.classList.add('d-none');
    successDiv.classList.add('d-none');
    
    try {
      const response = await fetch(`${API_BASE}/forgot-password`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ email })
      });
      
      const data = await response.json();
      
      if (data.status === 'success') {
        successDiv.textContent = data.message;
        successDiv.classList.remove('d-none');
        document.getElementById('forgotPasswordForm').reset();
      } else {
        errorDiv.textContent = data.message;
        errorDiv.classList.remove('d-none');
      }
    } catch (error) {
      errorDiv.textContent = 'Произошла ошибка при отправке запроса';
      errorDiv.classList.remove('d-none');
    }
  });
</script>
</body>
</html>
